<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>LanguageDeck reset</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 24px; line-height: 1.45; max-width: 680px; }
    button { font: inherit; padding: 12px 16px; border-radius: 12px; border: 1px solid #ddd; }
    code { background: rgba(127,127,127,.12); padding: 2px 5px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>LanguageDeck update reset</h1>
  <p>This page clears the PWA Service Worker and Cache Storage, then reloads the latest app. Your learned deck progress in IndexedDB is not deleted.</p>
  <p>Reset build: <code>3.3.0-grammar-forms-20260813</code></p>
  <button id="reset" type="button">Reset app cache and reopen</button>
  <p id="status"></p>
  <script>
    async function resetApp() {
      const status = document.getElementById("status");
      const stamp = "3.3.0-grammar-forms-20260813-" + Date.now();
      status.textContent = "Clearing app cache…";
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        status.textContent = "Done. Opening latest app…";
      } catch (err) {
        status.textContent = "Cleanup partly failed, opening app anyway: " + err.message;
      }
      location.replace("./?v=" + encodeURIComponent(stamp));
    }
    document.getElementById("reset").addEventListener("click", resetApp);
    resetApp();
  </script>
<a href="index.html" style="position:fixed;left:14px;bottom:14px;padding:10px 13px;border-radius:12px;background:#111827;color:white;text-decoration:none;font:700 13px system-ui">← Back to Course</a>
</body>
</html>
