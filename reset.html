<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LanguageDeck reset</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 24px; line-height: 1.45; }
    button { font: inherit; padding: 12px 16px; border-radius: 12px; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>LanguageDeck update reset</h1>
  <p>This page clears the PWA service worker and Cache Storage, then reloads the latest app. Your learned deck progress in IndexedDB is not deleted.</p>
  <button id="reset">Reset app cache and reopen</button>
  <p id="status"></p>
  <script>
    async function resetApp() {
      const status = document.getElementById("status");
      status.textContent = "Clearing app cache…";
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        status.textContent = "Done. Opening latest app…";
      } catch (err) {
        status.textContent = "Cleanup partly failed, opening app anyway: " + err.message;
      }
      location.replace("./?v=v22-quickswitch-cache-updatefix-20260630");
    }
    document.getElementById("reset").addEventListener("click", resetApp);
    resetApp();
  </script>
</body>
</html>
