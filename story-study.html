<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>LanguageDeck · Story Study v2.1</title>
<style>
:root{
  --bg:#f8fafc;--surface:#fff;--surface-2:#f1f5f9;--border:#e2e8f0;--border-strong:#cbd5e1;
  --text:#0f172a;--muted:#475569;--faint:#94a3b8;--primary:#1d4ed8;--primary-soft:#dbeafe;
  --primary-deep:#1e3a8a;--success:#15803d;--success-soft:#dcfce7;--danger:#b91c1c;
  --danger-soft:#fee2e2;--warning:#b45309;--warning-soft:#fef3c7;--tap:44px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --read:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit}
.ld-top{flex:0 0 auto;padding:9px 13px 8px;background:var(--surface);border-bottom:1px solid var(--border)}
.topline{display:flex;align-items:baseline;gap:7px;min-width:0}.title{font-family:var(--display);font-weight:750;font-size:15px}
.unit{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.progress{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.bars{display:flex;gap:2px;margin-top:6px}.bar{height:3px;min-width:2px;flex:1;background:var(--border);border-radius:2px}.bar.done{background:var(--primary)}.bar.now{background:var(--primary-soft)}
.statusrow{display:flex;align-items:center;gap:7px;margin-top:7px}.rhythm{font-family:var(--display);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--primary);padding:4px 9px;border-radius:999px}
.reason{font-size:11px;color:var(--faint);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adjust{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}.adjust button{border:0;background:transparent;width:29px;height:25px;font-size:15px;font-weight:800;color:var(--muted);padding:0}.adjust button:active{background:var(--surface-2)}
.stage{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 15px 10px;-webkit-overflow-scrolling:touch}.pane{display:none}.pane.on{display:block}
.bottom{flex:0 0 auto;display:flex;gap:8px;padding:9px 13px calc(9px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border)}
.bottom button{min-height:var(--tap);border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);padding:0 14px;font-family:var(--display);font-weight:750;color:var(--text)}
.bottom .primary{background:var(--primary);border-color:var(--primary);color:#fff;flex:1}.bottom .ghost{color:var(--muted)}.bottom .ghost.on{background:var(--primary-soft);color:var(--primary-deep);border-color:var(--primary-soft)}.hidden{display:none!important}
.card{background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:15px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.card h2{font-family:var(--display);font-size:19px;margin:0 0 5px}.card p{font-size:13.5px;line-height:1.48;color:var(--muted)}
.setting{margin-top:14px}.setting h3{font-size:12px;margin:0 0 6px;color:var(--muted)}.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.seg.three{grid-template-columns:repeat(3,1fr)}.seg button{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:8px 6px;font-size:12px;font-weight:700;color:var(--muted)}.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}.setting small{display:block;color:var(--faint);font-size:11.5px;line-height:1.4;margin-top:5px}
.start-summary{margin-top:14px;padding:10px 11px;border-radius:11px;background:var(--primary-soft);font-size:12.5px;line-height:1.45;color:var(--primary-deep)}.minor{margin-top:12px;border:0;background:transparent;color:var(--faint);font-size:11.5px;text-decoration:underline;padding:4px}
.rd-flow,.task-context,.clean-flow,.structure{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.rd-flow,.clean-flow{font-family:var(--read);font-size:19px;line-height:1.58;letter-spacing:.003em;min-width:0;white-space:normal;overflow-wrap:break-word;word-break:normal}.sentence{margin:0 0 5px;min-width:0;white-space:normal}.sentence.past{opacity:.4}.sentence.next{opacity:.15}.sentence.active{opacity:1}.tok{cursor:pointer;border-radius:3px;padding:0 .5px;white-space:normal}.sentence.active .tok.learning{text-decoration:underline dotted var(--border-strong);text-underline-offset:4px}.sentence.active .tok.opened{background:var(--warning-soft);text-decoration:underline solid var(--warning);text-underline-offset:4px}.clean-flow .tok{text-decoration:none!important;background:transparent!important;color:inherit!important}
.translation{font-family:var(--sans);font-size:13.5px;line-height:1.43;color:var(--muted);margin:5px 0 3px;padding-left:9px;border-left:2px solid var(--primary-soft)}.why-link{display:inline-block;margin-top:4px;color:var(--primary);font-size:12px;font-weight:700;cursor:pointer}.rail{display:flex;flex-direction:column;gap:6px;margin-top:11px}.gloss{display:flex;align-items:flex-start;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:8px 9px;font-size:12.5px;line-height:1.4}.gloss b{font-family:var(--display);font-size:13.5px;white-space:nowrap}.gloss span{color:var(--muted)}.gloss em{display:block;font-style:normal;color:var(--faint);font-size:11.5px;margin-top:2px}.learn-toggle{margin-left:auto;flex:0 0 auto;border:0;background:var(--primary-soft);color:var(--primary-deep);border-radius:999px;padding:4px 8px;font-size:10.5px;font-weight:750}.learn-toggle.off{background:var(--surface-2);color:var(--faint)}
.structure{background:var(--surface);border:1px solid var(--primary-soft);border-left:3px solid var(--primary);border-radius:11px;padding:10px 11px;font-size:12px;line-height:1.45;color:var(--muted)}.chunks{font-family:var(--read);font-size:16px;color:var(--text);margin-bottom:7px}.pattern-name{font-family:var(--display);font-weight:800;color:var(--primary-deep);margin-top:5px}
.phase-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.phase{font-family:var(--display);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--primary)}.count{margin-left:auto;color:var(--faint);font-size:12px}.warm-word{font-family:var(--display);font-size:28px;font-weight:800;text-align:center;margin:25px 0 20px}.options{display:flex;flex-direction:column;gap:7px}.options.grid{flex-direction:row;flex-wrap:wrap}.options button,.pick button{border:1px solid var(--border-strong);background:var(--surface);border-radius:11px;min-height:var(--tap);padding:9px 12px;text-align:left;color:var(--text);font-size:14px}.options button.good,.pick button.good{background:var(--success-soft);border-color:var(--success);color:var(--success)}.options button.bad,.pick button.bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}.options button:disabled,.pick button:disabled{opacity:.55}.note{margin-top:12px;padding:9px 10px;border-radius:11px;background:var(--surface-2);font-size:12.5px;line-height:1.45;color:var(--muted)}.note b{color:var(--text)}
.task-context{font-family:var(--read);font-size:18px;line-height:1.5;margin:7px 0 4px;white-space:normal;overflow-wrap:break-word}.task-context .focus{background:var(--primary-soft);border-radius:3px;padding:0 2px}.task-en{font-size:13px;color:var(--muted);margin:0 0 12px}.blank{display:inline-block;min-width:58px;border-bottom:2px solid var(--primary);color:var(--primary-deep);text-align:center;font-family:var(--display);font-weight:800}.pick{display:flex;flex-direction:column;gap:7px}.bank{display:flex;flex-wrap:wrap;gap:7px}.bank button{font-family:var(--display);font-weight:750}.built{min-height:42px;border:1px dashed var(--border-strong);border-radius:11px;padding:9px 10px;margin-bottom:10px;font-family:var(--read);font-size:17px;line-height:1.4}
.letters{text-align:center}.slots{font-family:var(--display);font-size:25px;font-weight:800;letter-spacing:.05em;margin:7px 0 16px}.slot{display:inline-block;min-width:18px;border-bottom:2px solid var(--border-strong);margin:0 1px}.slot.fixed{border-color:transparent}.slot.good{color:var(--success);border-color:var(--success)}.slot.bad{color:var(--danger);border-color:var(--danger)}.letter-bank{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.letter-bank button{min-width:43px;min-height:43px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);font-family:var(--display);font-size:18px;font-weight:800}.letter-bank button:disabled{opacity:.3}
.reread-title{font-family:var(--display);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--success);margin-bottom:5px}.reread-sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}.rr-gloss{margin:2px 0 9px;font-family:var(--sans)}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:#fff;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .18s;max-width:88vw;text-align:center;z-index:20}.toast.on{opacity:.94}
@media (max-height:720px){.ld-top{padding-top:6px;padding-bottom:6px}.stage{padding-top:10px}.rd-flow,.clean-flow{font-size:17px;line-height:1.48}.translation{font-size:12.5px}.bottom{padding-top:7px;padding-bottom:calc(7px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<header class="ld-top">
  <div class="topline"><span class="title" id="title"></span><span class="unit" id="unit"></span><span class="progress" id="progress"></span></div>
  <div class="bars" id="bars"></div>
  <div class="statusrow"><span class="rhythm" id="rhythm"></span><span class="reason" id="reason"></span><span class="adjust"><button id="less">−</button><button id="more">+</button></span></div>
</header>
<main class="stage" id="stage">
  <section class="pane on" id="startPane"><div class="card" id="startCard"></div></section>
  <section class="pane" id="warmPane"><div class="phase-head"><span class="phase">Meet the words</span><span class="count" id="warmCount"></span></div><div class="warm-word" id="warmWord"></div><div class="options" id="warmOptions"></div><div class="note hidden" id="warmNote"></div></section>
  <section class="pane" id="readPane"><div class="rd-flow" id="flow"></div><div class="rail" id="rail"></div></section>
  <section class="pane" id="practicePane"><div class="phase-head"><span class="phase" id="practicePhase"></span><span class="count" id="practiceCount"></span></div><div class="task-context" id="taskContext"></div><div class="task-en" id="taskEn"></div><div class="options" id="taskOptions"></div><div class="pick" id="taskPick"></div><div class="letters" id="taskLetters"><div class="slots" id="slots"></div><div class="letter-bank" id="letterBank"></div></div><div class="note hidden" id="taskNote"></div></section>
  <section class="pane" id="rereadPane"><div class="reread-title" id="rereadTitle"></div><p class="reread-sub" id="rereadSub"></p><div class="clean-flow" id="rereadFlow"></div></section>
</main>
<footer class="bottom"><button class="ghost hidden" id="secondary"></button><button class="primary" id="main">Start</button></footer>
<div class="toast" id="toast"></div>
<script>
const DATA = {"title":"Die Biene Maja","unit":"Kapitel 1","pageSize":6,"sentences":[{"id":"s001","page":0,"en":"Maja is a young bee.","de":"Maja ist eine junge Biene.","hint":"Hooks: young → jung, bee → Biene.","lvl":"A2","tk":[{"t":"Maja","w":"x.name.maja"},{"t":" ","w":null},{"t":"ist","w":"x.verb.sein"},{"t":" ","w":null},{"t":"eine","w":"x.article.ein"},{"t":" ","w":null},{"t":"junge","w":"x.adj.jung"},{"t":" ","w":null},{"t":"Biene","w":"w001"},{"t":".","w":null}],"pt":["de.adj.attributive-weak"],"ch":""},{"id":"s002","page":0,"en":"She was born in a big beehive.","de":"Sie wurde in einem großen Bienenstock geboren.","hint":"Passive with werden: wurde geboren = was born.","lvl":"A2","tk":[{"t":"Sie","w":"x.pron.sie"},{"t":" ","w":null},{"t":"wurde","w":"x.verb.werden"},{"t":" ","w":null},{"t":"in","w":"x.prep.in"},{"t":" ","w":null},{"t":"einem","w":"x.article.ein"},{"t":" ","w":null},{"t":"großen","w":"x.adj.gross"},{"t":" ","w":null},{"t":"Bienenstock","w":"w002"},{"t":" ","w":null},{"t":"geboren","w":"w003"},{"t":".","w":null}],"pt":["de.passive.werden","de.case.dat-after-prep"],"ch":"Sie wurde|in einem großen Bienenstock|geboren."},{"id":"s003","page":0,"en":"There was great unrest in the hive that day.","de":"An diesem Tag herrschte große Unruhe im Stock.","hint":"herrschen = to reign/prevail; Unruhe = un + Ruhe (rest).","lvl":"B1","tk":[{"t":"An","w":"x.prep.an"},{"t":" ","w":null},{"t":"diesem","w":"x.det.dieser"},{"t":" ","w":null},{"t":"Tag","w":"x.noun.tag"},{"t":" ","w":null},{"t":"herrschte","w":"x.verb.herrschen"},{"t":" ","w":null},{"t":"große","w":"x.adj.gross"},{"t":" ","w":null},{"t":"Unruhe","w":"w004"},{"t":" ","w":null},{"t":"im","w":"x.prep.im"},{"t":" ","w":null},{"t":"Stock","w":"x.noun.stock"},{"t":".","w":null}],"pt":["de.wordorder.verb-second"],"ch":"An diesem Tag|herrschte|große Unruhe im Stock."},{"id":"s004","page":0,"en":"Half the bee nation wanted to leave the city.","de":"Das halbe Bienenvolk wollte die Stadt verlassen.","hint":"verlassen = to leave (a place); no preposition.","lvl":"B1","tk":[{"t":"Das","w":"x.article.def"},{"t":" ","w":null},{"t":"halbe","w":"x.adj.halb"},{"t":" ","w":null},{"t":"Bienenvolk","w":"w005"},{"t":" ","w":null},{"t":"wollte","w":"x.verb.wollen"},{"t":" ","w":null},{"t":"die","w":"x.article.def"},{"t":" ","w":null},{"t":"Stadt","w":"x.noun.stadt"},{"t":" ","w":null},{"t":"verlassen","w":"w006"},{"t":".","w":null}],"pt":["de.modal.infinitive-final"],"ch":"Das halbe Bienenvolk|wollte|die Stadt|verlassen."},{"id":"s005","page":0,"en":"An old bee took care of little Maja.","de":"Eine alte Biene kümmerte sich um die kleine Maja.","hint":"sich kümmern um + accusative = to take care of.","lvl":"B1","tk":[{"t":"Eine","w":"x.article.ein"},{"t":" ","w":null},{"t":"alte","w":"x.adj.alt"},{"t":" ","w":null},{"t":"Biene","w":"w001"},{"t":" ","w":null},{"t":"kümmerte","w":"w007"},{"t":" ","w":null},{"t":"sich","w":"x.pron.reflexive"},{"t":" ","w":null},{"t":"um","w":"x.prep.um"},{"t":" ","w":null},{"t":"die","w":"x.article.def"},{"t":" ","w":null},{"t":"kleine","w":"x.adj.klein"},{"t":" ","w":null},{"t":"Maja","w":"x.name.maja"},{"t":".","w":null}],"pt":["de.reflexive.accusative"],"ch":""},{"id":"s006","page":0,"en":"Her name was Kassandra.","de":"Sie hieß Kassandra.","hint":"heißen: hieß in the past.","lvl":"A2","tk":[{"t":"Sie","w":"x.pron.sie"},{"t":" ","w":null},{"t":"hieß","w":"x.verb.heissen"},{"t":" ","w":null},{"t":"Kassandra","w":"x.name.kassandra"},{"t":".","w":null}],"pt":[],"ch":""},{"id":"s007","page":1,"en":"Kassandra was Maja's first teacher.","de":"Kassandra war Majas erste Lehrerin.","hint":"Female teacher: Lehrer + in.","lvl":"A2","tk":[{"t":"Kassandra","w":"x.name.kassandra"},{"t":" ","w":null},{"t":"war","w":"x.verb.sein"},{"t":" ","w":null},{"t":"Majas","w":"x.name.maja"},{"t":" ","w":null},{"t":"erste","w":"x.ordinal.erst"},{"t":" ","w":null},{"t":"Lehrerin","w":"w008"},{"t":".","w":null}],"pt":[],"ch":""},{"id":"s008","page":1,"en":"She showed Maja the function answerReorder(b){if(answered)return;const ans=JSON.parse($("taskPick").dataset.answer),built=JSON.parse($("taskPick").dataset.built),ok=b.dataset.unit===ans[built.length];b.disabled=true;if(!ok){$("built").textContent=ans.join(" ");$("built").style.color="var(--danger)";gradeSentence($("taskPick").dataset.sid,false);answered=true}else{built.push(b.dataset.unit);$("taskPick").dataset.built=JSON.stringify(built);$("built").textContent=built.join(" ");if(built.length===ans.length){gradeSentence($("taskPick").dataset.sid,true);answered=true}}if(answered){$("main").textContent=practiceIndex===practiceQueue.length-1?"Read the block again":"Next";save();if(ok)scheduleAutoAdvance(nextPractice)}}
function gradeSentence(id,ok){const st=sOf(id),s=DATA.sentences.find(x=>x.id===id);if(ok){if(st.lastSuccessBlock!==blockClock){st.lvl=Math.min(4,st.lvl+1);st.lastSuccessBlock=blockClock}st.due=blockClock+2;st.missesAtStage=0}else{const failedLevel=st.lvl;st.misses++;st.lvl=Math.max(1,st.lvl-1);st.missesAtStage=st.lastFailedLevel===failedLevel?(st.missesAtStage||0)+1:1;st.lastFailedLevel=failedLevel;st.due=blockClock+1;if(st.missesAtStage>=2){st.stage=Math.max(0,st.stage-1);st.missesAtStage=0;s.tk.forEach(t=>{if(t.w&&V[t.w]?.kind!=="name"){const k=kOf(t.w);k.collected=true;k.due=Math.min(k.due,blockClock+1)}});$("taskNote").classList.remove("hidden");$("taskNote").innerHTML=`<b>${esc(s.de)}</b><br>This returns in an easier form; its parts have also moved forward.`}else{$("taskNote").classList.remove("hidden");$("taskNote").innerHTML=`<b>${esc(s.de)}</b><br>${esc(s.en)}<br>No retry now. It returns in a later block.`}if(st.misses>=SENTENCE_HANDOFF){st.handedOff=true;st.due=Infinity;toast("This sentence moved to targeted Sentence/Grammar practice.")}}}
function paintPatternTask(id){const p=P[id],read=DATA.sentences.slice(0,position+currentBlock.length),yes=read.filter(s=>s.pt.includes(id)),no=read.filter(s=>!s.pt.includes(id));const answer=yes[0]||read[0],choices=shuffle([answer,...shuffle(no).slice(0,2)]);$("taskContext").textContent=p.name;$("taskEn").textContent="Which sentence uses the same structure?";$("taskOptions").innerHTML=choices.map(s=>`<button data-good="${s.id===answer.id?1:0}">${esc(s.de)}</button>`).join("");$("taskOptions").querySelectorAll("button").forEach(b=>b.onclick=()=>{const ok=b.dataset.good==="1";$("taskOptions").querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.good==="1")x.classList.add("good")});if(!ok)b.classList.add("bad");const pk=pOf(id);if(ok){pk.lvl++;pk.due=blockClock+2}else{pk.misses++;pk.due=blockClock+1}answered=true;$("main").textContent=practiceIndex===practiceQueue.length-1?"Read the block again":"Next";save();if(ok)scheduleAutoAdvance(nextPractice)})}
function nextPractice(){if(!answered){answered=true;if(practiceKind==="word"){const id=practiceQueue[practiceIndex];kOf(id).due=blockClock+1}else{const id=practiceQueue[practiceIndex];if(!id.startsWith("P:"))sOf(id).due=blockClock+1}}if(practiceIndex<practiceQueue.length-1){practiceIndex++;paintPractice()}else if(practiceKind==="word")startSentencePractice();else startReread()}
function startReread(){view="reread";show("rereadPane");demotedReread=new Set();$("rereadTitle").textContent="Read the block again";$("rereadSub").textContent="Same sentences, no marks. A tap can still reveal a problem, but silence does not earn points.";$("rereadFlow").innerHTML=currentBlock.map(s=>`<p class="sentence active" data-sid="${s.id}">${s.tk.map(t=>wordLike(t.t)?`<span class="tok" data-rr="${t.w}">${esc(t.t)}</span>`:esc(t.t)).join("")}</p>`).join("");$("secondary").classList.add("hidden");$("main").textContent=position+currentBlock.length>=DATA.sentences.length?"Finish chapter":"Continue the story";$("main").onclick=finishBlock;paintChrome();save()}
$("rereadFlow").onclick=e=>{if(e.target.closest(".rr-gloss"))return;const t=e.target.closest("[data-rr]");if(!t)return;const id=t.dataset.rr,v=V[id];if(!v)return;let g=t.closest(".sentence").nextElementSibling;if(!g||!g.classList.contains("rr-gloss")){g=document.createElement("div");g.className="gloss rr-gloss";t.closest(".sentence").after(g)}g.innerHTML=`<b>${esc((v.art?v.art+" ":"")+v.de)}</b><span>${esc(v.en)}</span>`;if(V[id].kind==="name"||demotedReread.has(id))return;demotedReread.add(id);const k=kOf(id);k.lvl=Math.max(1,k.lvl-1);k.readingMisses+=2;k.due=blockClock+1;k.collected=true;save()}
function finishBlock(){const lookupable=uniqueItems(currentBlock).length,lastWordFails=wordQueue.filter(id=>kOf(id).due===blockClock+1).length,lastSentFails=sentenceQueue.filter(id=>!id.startsWith("P:")&&sOf(id).due===blockClock+1).length;lastMetrics={tapRate:lookupable?tappedBlock.size/lookupable:0,sentenceFail:sentenceQueue.length?lastSentFails/sentenceQueue.length:0,structureOpens:Object.keys(PK).filter(id=>pOf(id).due===blockClock).length};position+=currentBlock.length;save();if(position>=DATA.sentences.length)finishChapter();else{prepareBlock();paintStart()}}
function finishChapter(){position=DATA.sentences.length;currentBlock=[];currentRhythm="read";view="start";show("startPane");paintChrome();const learned=Object.keys(K).filter(id=>kOf(id).lvl>=GOALS[settings.goal].ceiling).length,open=Object.keys(K).filter(id=>kOf(id).collected&&!kOf(id).handedOff&&kOf(id).lvl<GOALS[settings.goal].ceiling).length,handed=Object.keys(K).filter(id=>kOf(id).handedOff).length;$("startCard").innerHTML=`<h2>Chapter complete</h2><p>You reached the end without the story being blocked by performance.</p><div class="start-summary"><b>${learned}</b> items reached your current goal · <b>${open}</b> remain active · <b>${handed}</b> moved to targeted practice.</div><p>Reading again keeps the knowledge model. It does not erase what you learned.</p>`;$("secondary").classList.add("hidden");$("main").textContent="Read chapter again";$("main").onclick=()=>{position=0;save();paintStart()};save()}
["contextmenu","selectstart","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest(".rd-flow,.clean-flow,.task-context,.structure"))e.preventDefault()}));
load();translationPinned=settings.translation==="always"?true:translationPinned;paintStart();
</script>
